name: embedded sync

# install.sh and install.ps1 are fetched and piped to a shell, so they cannot
# read anything from the repo at run time: the package lists (deps/*.txt) and
# the inner scripts (inner/*) are embedded into them. Fail the build if an
# embedded copy no longer matches the canonical file it came from.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the embedded copies match deps/ and inner/
        run: ./tools/sync-embedded.sh --check

      # A lot of code moves between these files; a syntax error in an inner
      # script would otherwise only surface once it is embedded and run.
      - name: Shell syntax
        run: |
          for f in install.sh inner/slicer-deps inner/slicer-language tools/sync-embedded.sh; do
            sh -n "$f"
          done

      - name: shellcheck
        run: shellcheck -s sh install.sh inner/slicer-deps inner/slicer-language tools/sync-embedded.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($f in @('install.ps1', 'inner/slicer-language.ps1')) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) { $errors | ForEach-Object { Write-Host $_ }; throw "$f failed to parse" }
          }
